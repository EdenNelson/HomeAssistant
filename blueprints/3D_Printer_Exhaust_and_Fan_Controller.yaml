blueprint:
  name: Multi-Printer Exhaust & Fan Controller
  description: >
    Controls fans, purifiers, and switches across multiple 3D printers.
    When any printer starts printing, saves current fan/switch states and boosts 
    fans to 100%. Keeps fans running until ALL printers have returned to Idle for 
    the cooldown period, then restores original states.
  domain: automation
  input:
    printers:
      name: 3D Printer State Entities
      description: Select one or more state sensors for your printers.
      selector:
        entity:
          multiple: true
          filter:
            - domain: sensor
    fans:
      name: Fans & Air Purifiers
      description: Select fan entities to set to 100% when printing.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: fan
    switches:
      name: Switch-operated Fans
      description: Select switch entities to turn on when printing.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: switch
    cooldown:
      name: Cooldown Duration
      description: Time to keep fans running after ALL printers return to Idle.
      default: 15
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: minutes

mode: single

trigger:
  - platform: state
    entity_id: !input printers

condition:
  - condition: template
    # Only triggers the main script if at least one printer is currently printing
    value_template: >-
      {{ (printers_safe | map('states') | map('lower') | select('eq', 'printing') | list | length) > 0 }}

variables:
  printers_input: !input printers
  fans_input: !input fans
  switches_input: !input switches
  cooldown_time: !input cooldown

  # Ensure inputs are handled cleanly as arrays
  printers_safe: "{{ [printers_input] if printers_input is string else printers_input }}"
  fans_safe: "{{ [fans_input] if fans_input is string else fans_input }}"
  switches_safe: "{{ [switches_input] if switches_input is string else switches_input }}"
  all_entities: "{{ fans_safe + switches_safe }}"

  scene_id: "multi_3d_printer_fans_snapshot"

action:
  # 1. Take snapshot of baseline room state (Only runs once when the automation first starts)
  - alias: "Save initial state of fans and switches"
    if:
      - condition: template
        value_template: "{{ all_entities | length > 0 }}"
    then:
      - action: scene.create
        data:
          scene_id: "{{ scene_id }}"
          snapshot_entities: "{{ all_entities }}"

  # 2. Turn fans to 100% and switches ON
  - alias: "Turn fans to 100%"
    if:
      - condition: template
        value_template: "{{ fans_safe | length > 0 }}"
    then:
      - action: fan.turn_on
        target:
          entity_id: "{{ fans_safe }}"
        data:
          percentage: 100

  - alias: "Turn switches on"
    if:
      - condition: template
        value_template: "{{ switches_safe | length > 0 }}"
    then:
      - action: switch.turn_on
        target:
          entity_id: "{{ switches_safe }}"

  # 3. Main printer monitoring and cooldown loop
  - alias: "Wait for all printers to idle and complete cooldown"
    repeat:
      sequence:
        # Step A: Pause execution until 0 printers are in 'printing' state
        - wait_for_trigger:
            - platform: template
              value_template: >-
                {{ (printers_safe | map('states') | map('lower') | select('eq', 'printing') | list | length) == 0 }}

        # Step B: Run cooldown timer, but watch for any printer starting up again
        - wait_for_trigger:
            - platform: template
              value_template: >-
                {{ (printers_safe | map('states') | map('lower') | select('eq', 'printing') | list | length) > 0 }}
              id: printer_restarted
          timeout:
            minutes: "{{ cooldown_time }}"

      until:
        # Loop completes when the 15-min timer times out without a printer restarting
        - condition: template
          value_template: "{{ wait.trigger is none }}"

  # 4. Restore initial state (or apply fallback if Home Assistant restarted)
  - alias: "Restore prior states or fallback to Low"
    if:
      - condition: template
        value_template: "{{ states('scene.' ~ scene_id) not in ['unknown', 'unavailable'] }}"
    then:
      - action: scene.turn_on
        target:
          entity_id: "scene.{{ scene_id }}"
    else:
      - alias: "Fallback: Set fans to low (33%)"
        if:
          - condition: template
            value_template: "{{ fans_safe | length > 0 }}"
        then:
          - action: fan.turn_on
            target:
              entity_id: "{{ fans_safe }}"
            data:
              percentage: 33

      - alias: "Fallback: Turn off switches"
        if:
          - condition: template
            value_template: "{{ switches_safe | length > 0 }}"
        then:
          - action: switch.turn_off
            target:
              entity_id: "{{ switches_safe }}"
